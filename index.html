:root{

}

  --u-now:#FF6B7A; --u-soon:#FF9C52; --u-watch:#E8C14A; --u-home:#52D3A0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1216; --surface:#251920; --ink:#F7EAED; --ink-2:#C4ADB6; --line:#3D2A33;
  --villain:#F04A50; --gum:#4A2630; --tag-ink:#FFC2C5;
  --care-bg:#14342A; --care-ink:#8BE3C1;
  --reel-bg:#F7EAED; --reel-ink:#2B1B24; --reel-sub:#6F5963;
  --u-now:#FF6B7A; --u-soon:#FF9C52; --u-watch:#E8C14A; --u-home:#52D3A0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,a{font:inherit;color:inherit;touch-action:manipulation}

.view{display:flex;flex-direction:column;gap:18px;animation:in .28s ease-out both}

.m-body{fill:var(--villain)} .m-line{stroke:var(--v-line)} .m-white{fill:#fff} .m-pupil{fill:#2B1B24} .m-blush{fill:var(--blush)} .m-shadow{fill:var(--ink);opacity:.08}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}

/* home */
.hero{display:flex;align-items:center;gap:12px}
.hero .mascot{width:60px;flex:none}
.eyebrow{margin:0;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--ink-2)}

.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:96px;padding:12px 10px 11px;text-align:left;cursor:pointer;

.path{margin:0;font-size:12.5px;color:var(--ink-2)}

.play svg{width:14px;height:14px;fill:#fff}
.more{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding-top:4px;border-top:1px solid color-mix(in srgb,var(--reel-ink) 14%,transparent)}
.more p{margin:6px 0 0;font-size:12px;color:var(--reel-sub)}
.more a{font-size:14px;text-decoration:none;display:flex;gap:6px}
.more a .no{color:var(--villain);font-weight:700;flex:none}
.soon-chip{font-size:13.5px;display:flex;gap:6px}

.panel{border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.panel li{position:relative;padding-left:22px;font-size:15px;line-height:1.55}
.care{background:var(--care-bg)}
.care h3{color:var(--care-ink)}
.care li::before{content:"";position:absolute;left:2px;top:.5em;width:11px;height:6px;border-left:2.5px solid var(--care-ink);border-bottom:2.5px solid var(--care-ink);transform:rotate(-45deg)}
.goto{background:var(--surface);border:1.5px solid var(--line)}
.goto h3{color:var(--u-soon)}
.goto li::before{content:"";position:absolute;left:4px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--u-soon)}
.depts{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.dept{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;background:var(--gum)}
.dept b{font-size:14.5px;color:var(--tag-ink)}
.dept span{font-size:12px;color:var(--ink-2)}
.note{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55}

.foot{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.btn-line{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:999px;border:1.5px solid var(--ink);background:none;

.btn-soft{padding:12px 16px;border-radius:999px;border:0;background:var(--gum);color:var(--tag-ink);font-weight:700;font-size:15px;cursor:pointer}
.fine{margin:6px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-2);text-align:center}

@media (prefers-reduced-motion: reduce){.view,.bob{animation:none}.card,.opt,.play{transition:none}}
</style>

/* ===== 그리기 ===== */
const app = document.getElementById('app');
const stack = [];
/* 단독 사이트(버셀)에서는 폰 뒤로가기가 이전 단계로 가고, 링크는 같은 창에서 열림 */
let SA = false; try { SA = window.self === window.top; } catch(e) { SA = false; }
const TGT = SA ? '' : ' target="_blank" rel="noopener"';
let focusOn = false;
const pad = n => '#' + String(n).padStart(2,'0');
const reel = c => 'https://www.instagram.com/reel/' + c + '/';
const live = n => EP[n] && EP[n][1];

function villain(){
  return '<svg viewBox="0 0 120 112" aria-hidden="true">'+
    '<ellipse class="m-shadow" cx="60" cy="104" rx="34" ry="6"/>'+
    '<path class="m-body" d="M60 8C96 8 109 38 107 66C105 92 85 101 60 101C35 101 15 92 13 66C11 38 24 8 60 8Z"/>'+
    '<ellipse class="m-white" cx="40" cy="28" rx="10" ry="5.5" opacity=".35" transform="rotate(-28 40 28)"/>'+
    '<path class="m-line" d="M33 37L52 43M87 37L68 43" stroke-width="4.5" stroke-linecap="round" fill="none"/>'+
    '<ellipse class="m-white" cx="44" cy="53" rx="9" ry="10.5"/><ellipse class="m-white" cx="76" cy="53" rx="9" ry="10.5"/>'+
    '<circle class="m-pupil" cx="47.5" cy="55" r="4.6"/><circle class="m-pupil" cx="79.5" cy="55" r="4.6"/>'+
    '<ellipse class="m-blush" cx="31" cy="71" rx="7" ry="4" opacity=".85"/><ellipse class="m-blush" cx="89" cy="71" rx="7" ry="4" opacity=".85"/>'+
    '<path class="m-line" d="M46 72Q60 84 74 72" stroke-width="3.6" stroke-linecap="round" fill="none"/>'+
    '<path class="m-white" d="M63.5 76.6L66.6 84L70 75.2Z"/>'+
  '</svg>';
}

function show(){ focusOn = true; render(); window.scrollTo(0,0); }
function push(s){
  stack.push(s);
  if(SA){ try{ history.pushState({d:stack.length}, ''); }catch(e){} }
  show();
}
function back(){
  if(stack.length<=1) return;
  if(SA){ history.back(); return; }
  stack.pop(); show();
}
function home(){
  if(stack.length<=1) return;
  if(SA){ history.go(-(stack.length-1)); return; }
  stack.length = 1; show();
}
window.addEventListener('popstate', e => {
  const d = (e.state && e.state.d) || 1;
  if(d < stack.length){ stack.length = d; show(); }
});
function startSym(id){ const s = SYM.find(x=>x.id===id); if(!s) return; push({v:'q', n:id, sym:s, path:[s.lb]}); }
function pick(i){
  const st = stack[stack.length-1]; const [text, to] = Q[st.n].o[i];
  const path = st.path.concat(text);
  if(to.startsWith('R:')) push({v:'r', r:to.slice(2), sym:st.sym, path});
  else push({v:'q', n:to, sym:st.sym, path});
}

function render(){
  const s = stack[stack.length-1];
  if(s.v==='home') app.innerHTML = vHome();
  else if(s.v==='q') app.innerHTML = vQ(s);
  else app.innerHTML = vR(s);
  if(focusOn){ const f = app.querySelector('[data-focus]'); if(f) f.focus({preventScroll:true}); }
}

function vHome(){
  const n = Object.keys(EP).filter(live).length;
  return '<section class="view">'+
    '<header class="hero"><div class="mascot bob">'+villain()+'</div>'+
      '<div><p class="eyebrow">치아 살리는 치대생 · @ipsok_villain</p><h1 tabindex="-1" data-focus>어디가 불편해요?</h1></div></header>'+
    '<p class="lede">증상을 고르고 한두 가지만 답하면, 의심해 볼 것과 집에서 할 일, 찾아갈 진료과를 알려 드려요.</p>'+
    '<div class="grid">'+SYM.map(x=>
      '<button class="card" onclick="startSym(\''+x.id+'\')"><span class="lb">'+x.lb+'</span><span class="ht">'+x.ht+'</span></button>').join('')+
    '</div>'+
    '<p class="meta">증상 '+SYM.length+'가지 · 「치과 가기 전, 이것만은」 영상 '+n+'편과 연결</p>'+
    fine()+
  '</section>';
}

function vQ(s){
  const node = Q[s.n];
  return '<section class="view">'+
    '<div class="nav"><button class="ghost" onclick="back()">← 이전</button><div class="chiprow"><span class="tag">'+s.sym.tag+'</span><div class="mascot">'+villain()+'</div></div></div>'+
    '<div class="qwrap"><p class="eyebrow">'+s.path.join(' › ')+'</p><h2 tabindex="-1" data-focus>'+node.q+'</h2></div>'+
    '<div class="opts">'+node.o.map((o,i)=>
      '<button class="opt" onclick="pick('+i+')"><span>'+o[0]+'</span><span class="ar" aria-hidden="true">›</span></button>').join('')+
    '</div>'+
  '</section>';
}

function vReel(eps){
  const lives = eps.filter(live), soon = eps.filter(n=>EP[n] && !live(n));
  const playIc = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5L12.5 7L3 12.5Z"/></svg>';
  let head, btn, more = '';
  if(lives.length){
    const m = lives[0];
    head = '<p class="k">이 증상, 입속빌런이 영상으로 풀어 뒀어요</p><p class="t"><span class="no">'+pad(m)+'</span>'+EP[m][0]+'</p>';
    btn = '<a class="play" href="'+reel(EP[m][1])+'"'+TGT+'>'+playIc+'릴스로 보기</a>';
    const rest = lives.slice(1);
    if(rest.length || soon.length){
      more = '<div class="more">'+
        (rest.length ? '<p>같이 보면 좋은 편</p>'+rest.map(n=>'<a href="'+reel(EP[n][1])+'"'+TGT+'><span class="no">'+pad(n)+'</span><span>'+EP[n][0]+'</span></a>').join('') : '')+
        (soon.length ? '<p>곧 올라올 편</p>'+soon.map(n=>'<span class="soon-chip"><span class="b">'+pad(n)+'</span><span>'+EP[n][0]+'</span></span>').join('') : '')+
      '</div>';
    }
  } else if(soon.length){
    const m = soon[0];
    head = '<p class="k">이 주제 영상, 곧 올라와요</p><p class="t"><span class="no">'+pad(m)+'</span>'+EP[m][0]+'</p>';
    btn = '<a class="play" href="'+PROFILE+'"'+TGT+'>팔로우하고 먼저 보기</a>';
  } else {
    head = '<p class="k">이 주제는 아직 영상이 없어요</p><p class="t">댓글로 요청하면 다음 편 순서가 당겨져요</p>';
    btn = '<a class="play" href="'+PROFILE+'"'+TGT+'>@ipsok_villain 에서 요청하기</a>';
  }
  return '<div class="reel"><div class="mascot">'+villain()+'</div><div>'+head+'</div>'+btn+more+'</div>';
}

function vR(s){
  const r = R[s.r];
  const depts = r.dept.length ?
    '<div class="depts">'+r.dept.map(d=>'<div class="dept"><b>'+d+'</b><span>'+(DEPT[d]||'')+'</span></div>').join('')+'</div>'+
    '<p class="note">진료과는 어떤 분야를 보는 곳을 찾을지의 기준이에요. 대부분은 가까운 치과에서 먼저 봐도 괜찮아요.</p>' : '';
  return '<section class="view">'+
    '<div class="nav"><button class="ghost" onclick="back()">← 이전</button><button class="ghost" onclick="home()">처음으로</button></div>'+
    '<div class="dx"><span class="upill u-'+r.u+'">'+(r.ul||ULABEL[r.u])+'</span>'+
      '<p class="path">'+s.path.join(' › ')+'</p>'+
      '<p class="eyebrow">의심해 볼 수 있는 것</p><h2 tabindex="-1" data-focus>'+r.name+'</h2>'+
      '<p class="why">'+r.why+'</p></div>'+
    vReel(r.ep)+
    '<div class="panel care"><h3>지금 집에서 할 것</h3><ul>'+r.home.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'+
    '<div class="panel goto"><h3>이럴 땐 치과로</h3><ul>'+r.go.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+depts+'</div>'+
    '<div class="foot">'+
      '<a class="btn-line" href="'+PROFILE+'"'+TGT+'>@ipsok_villain 팔로우하고 다음 편 받기</a>'+
      '<button class="btn-soft" onclick="home()">다른 증상 보기</button>'+
    '</div>'+
    fine()+
  '</section>';
}

function fine(){
  return '<p class="fine">치대생이 교과서 기준으로 정리한 참고용 안내예요. 진단이나 치료 처방이 아니며, 정확한 판단은 치과의사의 진찰이 필요해요.</p>';
}

/* 시작: #jaw 처럼 증상 id로 들어오면 바로 그 질문부터 (스토리 링크용) */
stack.push({v:'home'});
if(SA){ try{ history.replaceState({d:1}, ''); }catch(e){} }
render();
const h = (location.hash||'').slice(1);
if(Q[h] && SYM.some(x=>x.id===h)) startSym(h);
</script>
